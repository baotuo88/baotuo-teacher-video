# Builds the Docker image and publishes it to GitHub's registry (ghcr.io/<owner>/baotuo-teacher-video).
#   push to main      → :latest and :sha-xxxxxxx
#   tag v1.2.3        → :1.2.3, :1.2 and :latest
#   pull request      → build only (amd64), nothing is published
#   manual run        → Actions tab → "Docker image" → Run workflow
#
# Optional mirror for mainland China (pulling from ghcr.io there is often slow): push the same image to Alibaba Cloud
# Container Registry as well. Settings → Secrets and variables → Actions:
#   variable ACR_IMAGE      e.g. registry.cn-hangzhou.aliyuncs.com/<namespace>/baotuo-teacher-video
#   secret   ACR_USERNAME   the registry login name
#   secret   ACR_PASSWORD   the registry password (fixed password set in the ACR console)
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Image names (registry paths must be lowercase)
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
          ACR_IMAGE: ${{ vars.ACR_IMAGE }}
        run: |
          echo "ghcr=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/baotuo-teacher-video" >> "$GITHUB_OUTPUT"
          echo "acr_host=${ACR_IMAGE%%/*}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud (optional mirror)
        if: env.PUSH == 'true' && vars.ACR_IMAGE != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.names.outputs.acr_host }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}


      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.names.outputs.ghcr }}
            ${{ vars.ACR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=baotuo-teacher-video
            org.opencontainers.image.description=宝拓讲解视频：主题或素材 → 手绘动画讲解视频的 Web 应用
            org.opencontainers.image.licenses=AGPL-3.0

      # the engine (Frametell) is fetched from GitHub inside the build at the commit pinned in the Dockerfile
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: How to deploy
        if: env.PUSH == 'true'
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "On another machine: copy deploy/docker-compose.yml and deploy/.env.example (as .env), then"
            echo '`docker compose pull && docker compose up -d`'
          } >> "$GITHUB_STEP_SUMMARY"
